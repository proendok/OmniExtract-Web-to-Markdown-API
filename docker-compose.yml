version: '3.8'

services:
  omniextract-api:
    build: .
    container_name: omniextract_api
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - omniextract_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/omniextract.db

volumes:
  omniextract_data:
